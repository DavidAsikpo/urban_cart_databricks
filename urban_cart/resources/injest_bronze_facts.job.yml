# A sample job for urban_cart.

resources:
  jobs:
    injest_bronze_facts_dimensions:
      name: injest_bronze_facts

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.bronze_schema}

      tasks:
        - task_key: inventorty_task
          environment_key: default
          notebook_task:
            notebook_path: ../src/bronze/injest_inventory.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.bronze_schema}

        - task_key: orders_task
          environment_key: default
          notebook_task:
            notebook_path: ../src/bronze/injest_orders.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.bronze_schema}

        - task_key: returns_task
          environment_key: default
          notebook_task:
            notebook_path: ../src/bronze/injest_returns.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.bronze_schema}

        - task_key: order_items_task
          environment_key: default
          notebook_task:
            notebook_path: ../src/bronze/injest_order_items.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.bronze_schema}

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
