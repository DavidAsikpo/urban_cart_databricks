# The main pipeline for urban_cart

resources:
  pipelines:
    urban_cart_etl:
      name: urban_cart_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/urban_cart_etl"

      libraries:
        - glob:
            include: ../src/urban_cart_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
