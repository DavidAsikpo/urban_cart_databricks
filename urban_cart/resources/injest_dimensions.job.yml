# A sample job for urban_cart.

resources:
  jobs:
    injest_dimensions:
      name: injest_dimensions

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: notebook_task
          environment_key: default
          notebook_task:
            notebook_path: ../src/bronze/injest_dimensions.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.bronze_schema}


      environments:
        - environment_key: default
          spec:
            environment_version: "5"
