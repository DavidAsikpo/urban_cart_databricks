# This is a Declarative Automation Bundle definition for urban_cart.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: urban_cart
  uuid: 1404378e-2ce1-4336-b93a-78f917817d05

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-237a52c1-219a.cloud.databricks.com
    variables:
      catalog: urban_cart
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-237a52c1-219a.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/asikpodavid2@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/asikpodavid2@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: urban_cart
      schema: prod
    permissions:
      - user_name: asikpodavid2@gmail.com
        level: CAN_MANAGE
